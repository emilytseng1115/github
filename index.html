<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Pages 測試網站</title>

  <style>
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #fce7f3);
      color: #333;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      max-width: 600px;
    }

    h1 {
      color: #2563eb;
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>我的 GitHub Pages 測試網站</h1>
      <p>
        這是一個靜態 HTML 網頁，<br>
        可以部署到 GitHub Pages 進行測試。
      </p>

      <a class="btn" href="https://github.com" target="_blank">
        前往 GitHub
      </a>

      <footer>
        © 2026 我的第一個靜態網站
      </footer>
    </div>
  </div>
</body>
</html>
